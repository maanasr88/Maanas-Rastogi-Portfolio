<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330">
<title>Memory plus cooling power, indexed against DDR5: conventional 100 percent, Gator Memory 42 percent</title>
<rect width="1200" height="330" rx="14" fill="#0d0e11"/>
<text x="40" y="52" fill="#f4f4f5" font-size="26" font-weight="600" font-family="Inter Tight, system-ui, sans-serif">Memory + cooling power, indexed</text>
<text x="236" y="128" text-anchor="end" fill="#f4f4f5" font-size="21" font-weight="400" font-family="Inter Tight, system-ui, sans-serif">Conventional DDR5</text>
<rect x="260" y="100" width="880.0" height="40" rx="8" fill="#8a94a6" fill-opacity="0.55"/>
<text x="1126.0" y="128" text-anchor="end" fill="#0b0c0f" font-size="20" font-weight="700" font-family="JetBrains Mono, ui-monospace, monospace">100%</text>
<text x="260" y="166" fill="#7c7f89" font-size="16" font-family="Inter Tight, system-ui, sans-serif">active · refresh · leakage · cooling</text>
<text x="236" y="228" text-anchor="end" fill="#f4f4f5" font-size="21" font-weight="600" font-family="Inter Tight, system-ui, sans-serif">Gator Memory</text>
<rect x="260" y="200" width="369.6" height="40" rx="8" fill="#ff7a52" fill-opacity="0.9"/>
<text x="615.6" y="228" text-anchor="end" fill="#0b0c0f" font-size="20" font-weight="700" font-family="JetBrains Mono, ui-monospace, monospace">42%</text>
<text x="260" y="266" fill="#7c7f89" font-size="16" font-family="Inter Tight, system-ui, sans-serif">active + cooling only: no refresh, no leakage</text>
</svg>