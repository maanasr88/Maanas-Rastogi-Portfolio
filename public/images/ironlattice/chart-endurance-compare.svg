<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
<title>Endurance before fatigue: NAND flash 10^3 to 10^5 cycles, ferroelectric memory today 10^6 to 10^8, Gator Memory 10^10 demonstrated with a path to 10^13</title>
