<line x1="993.3333333333334" y1="90" x2="993.3333333333334" y2="430" stroke="#1e2025"/>
<text x="993.3333333333334" y="464" text-anchor="middle" fill="#7c7f89" font-size="18" font-family="JetBrains Mono, ui-monospace, monospace">10¹²</text>
