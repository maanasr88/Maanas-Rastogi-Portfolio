<line x1="1066.6666666666665" y1="90" x2="1066.6666666666665" y2="430" stroke="#ffb347" stroke-opacity="0.35" stroke-dasharray="3 6"/>
<text x="1140" y="70" text-anchor="end" fill="#7c7f89" font-size="16" font-family="Inter Tight, system-ui, sans-serif">At 10¹³ cycles, Gator covers most DRAM applications</text>
