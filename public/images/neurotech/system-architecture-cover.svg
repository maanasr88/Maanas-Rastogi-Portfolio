<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
<title>Sensor-fused wheelchair system: joystick, EEG headset and spatial sensors feed an ESP32, which drives a motor controller and brushed motor, powered from a 24 V supply through buck converters</title>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#fff" fill-opacity="0.05"/></pattern>
