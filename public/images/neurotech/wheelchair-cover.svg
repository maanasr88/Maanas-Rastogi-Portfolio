<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="900" fill="#0a0a0c"/>
<defs>
<radialGradient id="ntBgGlow" cx="48%" cy="42%" r="65%"><stop offset="0%" stop-color="#4682B4" stop-opacity="0.18"/><stop offset="100%" stop-color="#4682B4" stop-opacity="0"/></radialGradient>
<linearGradient id="ntSeatGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2f6690"/><stop offset="100%" stop-color="#1c3146"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#ntBgGlow)"/>

<!-- floor line -->
<line x1="60" y1="760" x2="1540" y2="760" stroke="#1c2a36" stroke-width="2"/>

<!-- rear wheel (large) -->
<circle cx="520" cy="660" r="150" fill="none" stroke="#2a3a4a" stroke-width="22"/>
<circle cx="520" cy="660" r="150" fill="none" stroke="#4682B4" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="520" cy="660" r="96" fill="#11161c" stroke="#3f78a8" stroke-width="2" stroke-opacity="0.6"/>
<g stroke="#3f78a8" stroke-width="2" stroke-opacity="0.5">
<line x1="520" y1="564" x2="520" y2="756"/>
<line x1="424" y1="660" x2="616" y2="660"/>
<line x1="452" y1="592" x2="588" y2="728"/>
<line x1="452" y1="728" x2="588" y2="592"/>
</g>
<circle cx="520" cy="660" r="16" fill="#5b9fd4" opacity="0.9"/>
<circle cx="520" cy="660" r="30" fill="#5b9fd4" opacity="0.25"/>

<!-- front caster wheel (small) -->
<circle cx="980" cy="712" r="48" fill="none" stroke="#2a3a4a" stroke-width="16"/>
<circle cx="980" cy="712" r="48" fill="none" stroke="#4682B4" stroke-width="2" stroke-opacity="0.5"/>
<circle cx="980" cy="712" r="10" fill="#3f78a8"/>

<!-- chassis frame -->
<path d="M 370 660 L 370 540 Q 370 500 410 500 L 980 500 Q 1030 500 1030 550 L 1030 664"
      fill="none" stroke="#5b9fd4" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<path d="M 370 540 L 980 540" stroke="#5b9fd4" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

<!-- seat + backrest -->
<rect x="400" y="430" width="300" height="60" rx="10" fill="url(#ntSeatGrad)" stroke="#5b9fd4" stroke-width="2" stroke-opacity="0.6"/>
<rect x="400" y="200" width="60" height="250" rx="10" fill="url(#ntSeatGrad)" stroke="#5b9fd4" stroke-width="2" stroke-opacity="0.6"/>

<!-- headrest + EEG headband -->
<rect x="405" y="175" width="50" height="34" rx="8" fill="#24435c" stroke="#5b9fd4" stroke-width="2" stroke-opacity="0.6"/>
<path d="M 400 182 Q 430 150 460 182" fill="none" stroke="#8fc1e8" stroke-width="4" stroke-linecap="round"/>
<circle cx="400" cy="182" r="5" fill="#dce8f5"/>
<circle cx="460" cy="182" r="5" fill="#dce8f5"/>
<circle cx="430" cy="160" r="6" fill="#dce8f5"/>
<circle cx="430" cy="160" r="16" fill="#5b9fd4" opacity="0.35"/>

<!-- armrest + joystick box -->
<rect x="640" y="440" width="140" height="18" rx="6" fill="#2a3a4a"/>
<rect x="740" y="410" width="64" height="46" rx="8" fill="#15222f" stroke="#dce8f5" stroke-width="2.5"/>
<line x1="772" y1="410" x2="772" y2="372" stroke="#dce8f5" stroke-width="6" stroke-linecap="round"/>
<circle cx="772" cy="368" r="9" fill="#dce8f5"/>
<circle cx="772" cy="368" r="20" fill="#5b9fd4" opacity="0.35"/>

<!-- electronics tray under seat -->
<rect x="470" y="560" width="200" height="44" rx="6" fill="#15222f" stroke="#4682B4" stroke-width="2" stroke-opacity="0.7"/>
<g stroke="#3f78a8" stroke-width="1.5" opacity="0.6">
<line x1="500" y1="560" x2="500" y2="604"/>
<line x1="540" y1="560" x2="540" y2="604"/>
<line x1="580" y1="560" x2="580" y2="604"/>
<line x1="620" y1="560" x2="620" y2="604"/>
</g>

<!-- ultrasonic sensor nodes at the four frame corners, with radiating arcs -->
<g>
<circle cx="370" cy="540" r="7" fill="#dce8f5"/>
<path d="M 355 525 A 24 24 0 0 1 355 515" fill="none" stroke="#5b9fd4" stroke-width="2" opacity="0.7"/>
<path d="M 345 530 A 34 34 0 0 1 345 510" fill="none" stroke="#5b9fd4" stroke-width="2" opacity="0.4"/>

<circle cx="1030" cy="550" r="7" fill="#dce8f5"/>
<path d="M 1045 535 A 24 24 0 0 0 1045 525" fill="none" stroke="#5b9fd4" stroke-width="2" opacity="0.7"/>
<path d="M 1055 540 A 34 34 0 0 0 1055 520" fill="none" stroke="#5b9fd4" stroke-width="2" opacity="0.4"/>

<circle cx="370" cy="660" r="7" fill="#dce8f5"/>
<circle cx="1030" cy="664" r="7" fill="#dce8f5"/>
</g>

<!-- subtle motion/connection lines between subsystems, echoing a circuit motif -->
<g stroke="#4682B4" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.5">
<line x1="772" y1="433" x2="772" y2="500"/>
<line x1="570" y1="560" x2="570" y2="500"/>
<line x1="430" y1="209" x2="430" y2="300"/>
</g>
</svg>
