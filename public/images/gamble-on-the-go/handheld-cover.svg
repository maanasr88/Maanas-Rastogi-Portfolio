<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<rect width="1600" height="900" fill="#0a0a0c"/>
<defs>
<radialGradient id="gBgGlow" cx="50%" cy="40%" r="65%"><stop offset="0%" stop-color="#BF5700" stop-opacity="0.18"/><stop offset="100%" stop-color="#BF5700" stop-opacity="0"/></radialGradient>
<linearGradient id="gScreenGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8a3d00"/><stop offset="100%" stop-color="#1f130c"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#gBgGlow)"/>

<!-- faint background suit motifs (reuses the same validated spade silhouette, mirrored) -->
<g fill="none" stroke="#BF5700" stroke-width="3" opacity="0.14">
<path d="M 230 180 C 170 230 150 300 230 340 C 220 380 190 400 160 405 L 300 405 C 270 400 240 380 230 340 C 310 300 290 230 230 180 Z"/>
<path d="M 230 180 C 170 230 150 300 230 340 C 220 380 190 400 160 405 L 300 405 C 270 400 240 380 230 340 C 310 300 290 230 230 180 Z" transform="translate(1140,460) scale(-1,-1) translate(-230,-290)"/>
</g>

<!-- handheld device body -->
<rect x="480" y="150" width="640" height="600" rx="36" fill="#11161c" stroke="#BF5700" stroke-opacity="0.65" stroke-width="2.5"/>

<!-- screen -->
<rect x="540" y="210" width="520" height="300" rx="10" fill="url(#gScreenGrad)" stroke="#F8971F" stroke-opacity="0.5" stroke-width="1.5"/>

<!-- card icon on screen: two overlapping playing cards -->
<g>
<rect x="690" y="270" width="130" height="180" rx="10" fill="#0a0a0c" stroke="#F8971F" stroke-width="2"/>
<rect x="740" y="250" width="130" height="180" rx="10" fill="#1f130c" stroke="#FDE8D5" stroke-width="2.5"/>
<path d="M 805 300 C 790 316 778 332 778 346 C 778 358 787 366 805 366 C 823 366 832 358 832 346 C 832 332 820 316 805 300 Z" fill="#FDE8D5"/>
<rect x="799" y="366" width="5" height="18" fill="#FDE8D5"/>
<rect x="796" y="384" width="18" height="4" fill="#FDE8D5"/>
<text x="757" y="285" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#FDE8D5">A</text>
</g>

<!-- bilingual EN / ES pill on screen -->
<rect x="560" y="470" width="86" height="26" rx="13" fill="none" stroke="#F8971F" stroke-width="1.5" opacity="0.8"/>
<text x="603" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FDE8D5" opacity="0.9">EN/ES</text>

<!-- 4 tactile buttons -->
<g>
<circle cx="580" cy="580" r="28" fill="#1f130c" stroke="#F8971F" stroke-width="2"/>
<circle cx="660" cy="580" r="28" fill="#1f130c" stroke="#F8971F" stroke-width="2"/>
<circle cx="740" cy="580" r="28" fill="#1f130c" stroke="#F8971F" stroke-width="2"/>
<circle cx="820" cy="580" r="28" fill="#1f130c" stroke="#F8971F" stroke-width="2"/>
<circle cx="580" cy="580" r="10" fill="#BF5700" opacity="0.7"/>
<circle cx="660" cy="580" r="10" fill="#BF5700" opacity="0.7"/>
<circle cx="740" cy="580" r="10" fill="#BF5700" opacity="0.7"/>
<circle cx="820" cy="580" r="10" fill="#BF5700" opacity="0.7"/>
</g>

<!-- slide potentiometer -->
<rect x="900" y="560" width="140" height="40" rx="8" fill="#1f130c" stroke="#F8971F" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="912" y="574" width="116" height="4" fill="#A64B00"/>
<rect x="955" y="566" width="18" height="28" rx="4" fill="#FDE8D5" stroke="#F8971F" stroke-width="1.5"/>

<!-- speaker grille (ADC-driven sound) -->
<g fill="#2a3a4a">
<circle cx="520" cy="650" r="3"/><circle cx="534" cy="650" r="3"/><circle cx="548" cy="650" r="3"/>
<circle cx="520" cy="664" r="3"/><circle cx="534" cy="664" r="3"/><circle cx="548" cy="664" r="3"/>
<circle cx="520" cy="678" r="3"/><circle cx="534" cy="678" r="3"/><circle cx="548" cy="678" r="3"/>
</g>

<!-- board edge connector ticks -->
<g stroke="#BF5700" stroke-width="2" opacity="0.5">
<line x1="520" y1="150" x2="520" y2="130"/>
<line x1="560" y1="150" x2="560" y2="130"/>
<line x1="1080" y1="150" x2="1080" y2="130"/>
<line x1="1040" y1="150" x2="1040" y2="130"/>
</g>
</svg>
